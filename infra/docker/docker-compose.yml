services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: starai
      POSTGRES_PASSWORD: starai
      POSTGRES_DB: starai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  searxng:
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    profiles:
      - search
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-local-internal-search-secret}
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_PORT: 8080
      SEARXNG_LIMITER: "false"
      SEARXNG_PUBLIC_INSTANCE: "false"
      FORCE_OWNERSHIP: "false"
    ports:
      - "127.0.0.1:${SEARXNG_BIND_PORT:-8888}:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    mem_limit: ${SEARXNG_MEMORY_LIMIT:-768m}
    cpus: ${SEARXNG_CPUS:-1.0}
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: starai
      MINIO_ROOT_PASSWORD: starai123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock-new-api:
    build:
      context: ../../services/mock-new-api
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      MOCK_FAILURE_RATE: "0"

  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://starai:starai@postgres:5432/starai?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: starai
      MINIO_SECRET_KEY: starai123
      MINIO_BUCKET: starai-works
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_URL: http://localhost:9000
      JWT_SECRET: dev-jwt-secret-starai
      ADMIN_JWT_SECRET: dev-admin-jwt-secret
      MODEL_ROUTE_CIPHER_KEY: dev-model-route-cipher-key
      NEW_API_BASE_URL: http://mock-new-api:3002
      NEW_API_TOKEN: change-me-dev-model-gateway-token
      API_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      mock-new-api:
        condition: service_started

  worker:
    build:
      context: ../../services/worker
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://starai:starai@postgres:5432/starai?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: starai
      MINIO_SECRET_KEY: starai123
      MINIO_BUCKET: starai-works
      MINIO_USE_SSL: "false"
      NEW_API_BASE_URL: http://mock-new-api:3002
      NEW_API_TOKEN: change-me-dev-model-gateway-token
      MODEL_ROUTE_CIPHER_KEY: dev-model-route-cipher-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      mock-new-api:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
